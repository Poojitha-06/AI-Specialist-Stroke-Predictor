<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stroke Risk Predictor - Comprehensive Health Assessment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .form-container {
            padding: 40px;
        }

        .section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            border-left: 5px solid #667eea;
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-field {
            display: flex;
            flex-direction: column;
        }

        .input-field label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
        }

        .input-field label .required {
            color: red;
        }

        .input-field input, .input-field select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
        }

        .input-field input:focus, .input-field select:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-field input[type="number"] {
            width: 100%;
        }

        .input-field input::placeholder {
            color: #999;
        }

        .bp-hint {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .predict-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
            margin-top: 20px;
        }

        .predict-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .reset-btn {
            background: #6c757d;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .reset-btn:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .result {
            margin-top: 30px;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .result.high-risk {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .result.moderate-risk {
            background: linear-gradient(135deg, #ff9966 0%, #ff5e62 100%);
            color: white;
        }

        .result.low-risk {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .result h3 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .result p {
            font-size: 1.1em;
            margin: 10px 0;
        }

        .risk-percentage {
            font-size: 3em;
            font-weight: bold;
            margin: 20px 0;
        }

        .recommendations {
            text-align: left;
            margin-top: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }

        .recommendations ul {
            margin-left: 20px;
            margin-top: 10px;
        }

        .recommendations li {
            margin: 8px 0;
        }

        .hidden {
            display: none;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .form-container {
                padding: 20px;
            }
            .input-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🫀 Stroke Risk Prediction System</h1>
            <p>Comprehensive Health Assessment using Clinical & Lifestyle Features</p>
        </div>

        <div class="form-container">
            <form id="strokeForm" onsubmit="return false;">
                <!-- Demographic Section -->
                <div class="section">
                    <h2>📋 Demographic Information</h2>
                    <div class="input-group">
                        <div class="input-field">
                            <label>Age (years) <span class="required">*</span></label>
                            <input type="number" id="age" name="age" placeholder="Enter your age" required min="0" max="120" step="1">
                        </div>
                        <div class="input-field">
                            <label>Gender <span class="required">*</span></label>
                            <select id="gender">
                                <option value="" disabled selected>Select gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="input-field">
                            <label>Marital Status</label>
                            <select id="marital">
                                <option value="" disabled selected>Select marital status</option>
                                <option value="married">Married</option>
                                <option value="single">Single</option>
                                <option value="divorced">Divorced</option>
                                <option value="widowed">Widowed</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Clinical Measurements Section -->
                <div class="section">
                    <h2>🩺 Clinical Measurements</h2>
                    <div class="input-group">
                        <div class="input-field">
                            <label>Cholesterol (mg/dL) <span class="required">*</span></label>
                            <input type="number" id="cholesterol" placeholder="e.g., 180" required step="1">
                        </div>
                        <div class="input-field">
                            <label>Blood Pressure (mmHg) <span class="required">*</span></label>
                            <input type="number" id="bloodPressure" placeholder="e.g., 120" required step="1">
                            <div class="bp-hint">Normal: 120/80 mmHg (enter systolic value)</div>
                        </div>
                        <div class="input-field">
                            <label>BMI (kg/m²) <span class="required">*</span></label>
                            <input type="number" id="bmi" placeholder="e.g., 24.5" required step="0.1">
                        </div>
                        <div class="input-field">
                            <label>Glucose Level (mg/dL) <span class="required">*</span></label>
                            <input type="number" id="glucose" placeholder="e.g., 95" required step="1">
                        </div>
                    </div>
                </div>

                <!-- Lifestyle Factors Section -->
                <div class="section">
                    <h2>🚬 Lifestyle Factors</h2>
                    <div class="input-group">
                        <div class="input-field">
                            <label>Smoking Status <span class="required">*</span></label>
                            <select id="smoking">
                                <option value="" disabled selected>Select smoking status</option>
                                <option value="never">Never Smoked</option>
                                <option value="former">Former Smoker</option>
                                <option value="current">Current Smoker</option>
                            </select>
                        </div>
                        <div class="input-field">
                            <label>Alcohol Consumption <span class="required">*</span></label>
                            <select id="alcohol">
                                <option value="" disabled selected>Select alcohol consumption</option>
                                <option value="none">Never</option>
                                <option value="occasional">Occasional (1-2 drinks/week)</option>
                                <option value="moderate">Moderate (3-7 drinks/week)</option>
                                <option value="heavy">Heavy (>7 drinks/week)</option>
                            </select>
                        </div>
                        <div class="input-field">
                            <label>Physical Activity <span class="required">*</span></label>
                            <select id="activity">
                                <option value="" disabled selected>Select activity level</option>
                                <option value="sedentary">Sedentary (No exercise)</option>
                                <option value="light">Light (1-2 times/week)</option>
                                <option value="moderate">Moderate (3-4 times/week)</option>
                                <option value="active">Active (Daily exercise)</option>
                            </select>
                        </div>
                        <div class="input-field">
                            <label>Diet Quality <span class="required">*</span></label>
                            <select id="diet">
                                <option value="" disabled selected>Select diet quality</option>
                                <option value="poor">Poor (High processed food)</option>
                                <option value="average">Average</option>
                                <option value="good">Good (Balanced diet)</option>
                                <option value="excellent">Excellent (Healthy diet)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Medical History Section -->
                <div class="section">
                    <h2>🏥 Medical History</h2>
                    <div class="input-group">
                        <div class="input-field">
                            <label>Hypertension <span class="required">*</span></label>
                            <select id="hypertension">
                                <option value="" disabled selected>Select yes/no</option>
                                <option value="no">No</option>
                                <option value="yes">Yes</option>
                            </select>
                        </div>
                        <div class="input-field">
                            <label>Heart Disease <span class="required">*</span></label>
                            <select id="heartDisease">
                                <option value="" disabled selected>Select yes/no</option>
                                <option value="no">No</option>
                                <option value="yes">Yes</option>
                            </select>
                        </div>
                        <div class="input-field">
                            <label>Diabetes <span class="required">*</span></label>
                            <select id="diabetes">
                                <option value="" disabled selected>Select yes/no</option>
                                <option value="no">No</option>
                                <option value="yes">Yes</option>
                            </select>
                        </div>
                        <div class="input-field">
                            <label>Family History of Stroke <span class="required">*</span></label>
                            <select id="familyHistory">
                                <option value="" disabled selected>Select yes/no</option>
                                <option value="no">No</option>
                                <option value="yes">Yes</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button type="button" class="predict-btn" onclick="validateAndPredict()">
                    🔍 Predict Stroke Risk
                </button>
                <button type="button" class="reset-btn" onclick="resetForm()">
                    🔄 Reset All Fields
                </button>
            </form>

            <div id="result" class="result hidden"></div>
            <div id="errorMessage" class="error-message hidden"></div>
        </div>
    </div>

    <script>
        function validateAndPredict() {
            // Get all required fields
            const requiredFields = [
                'age', 'gender', 'cholesterol', 'bloodPressure', 
                'bmi', 'glucose', 'smoking', 'alcohol', 'activity', 'diet',
                'hypertension', 'heartDisease', 'diabetes', 'familyHistory'
            ];
            
            let missingFields = [];
            
            // Check each required field
            for (let field of requiredFields) {
                const element = document.getElementById(field);
                if (!element.value || element.value === "") {
                    missingFields.push(field);
                }
            }
            
            // Also check marital status (optional but we'll check)
            const marital = document.getElementById('marital').value;
            if (!marital || marital === "") {
                // Marital is optional, so we don't add to missing fields
                // But we'll set a default value
                document.getElementById('marital').value = 'single';
            }
            
            if (missingFields.length > 0) {
                const fieldNames = missingFields.map(field => {
                    const labels = {
                        'age': 'Age',
                        'gender': 'Gender',
                        'cholesterol': 'Cholesterol',
                        'bloodPressure': 'Blood Pressure',
                        'bmi': 'BMI',
                        'glucose': 'Glucose Level',
                        'smoking': 'Smoking Status',
                        'alcohol': 'Alcohol Consumption',
                        'activity': 'Physical Activity',
                        'diet': 'Diet Quality',
                        'hypertension': 'Hypertension',
                        'heartDisease': 'Heart Disease',
                        'diabetes': 'Diabetes',
                        'familyHistory': 'Family History'
                    };
                    return labels[field];
                });
                
                showError(`Please fill in all required fields: ${fieldNames.join(', ')}`);
                return;
            }
            
            // Clear any previous error
            hideError();
            
            // Proceed with prediction
            predictStroke();
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
            
            // Hide result if showing
            document.getElementById('result').classList.add('hidden');
            
            // Auto-hide error after 5 seconds
            setTimeout(() => {
                errorDiv.classList.add('hidden');
            }, 5000);
        }
        
        function hideError() {
            document.getElementById('errorMessage').classList.add('hidden');
        }
        
        function resetForm() {
            // Reset all input fields
            const inputs = document.querySelectorAll('input, select');
            inputs.forEach(input => {
                if (input.type === 'number' || input.type === 'text') {
                    input.value = '';
                } else if (input.tagName === 'SELECT') {
                    input.selectedIndex = 0;
                }
            });
            
            // Hide result and error
            document.getElementById('result').classList.add('hidden');
            document.getElementById('errorMessage').classList.add('hidden');
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        function calculateStrokeRisk() {
            // Get all input values
            const age = parseInt(document.getElementById('age').value);
            const gender = document.getElementById('gender').value;
            const marital = document.getElementById('marital').value || 'single';
            const cholesterol = parseInt(document.getElementById('cholesterol').value);
            const bloodPressure = parseInt(document.getElementById('bloodPressure').value);
            const bmi = parseFloat(document.getElementById('bmi').value);
            const glucose = parseInt(document.getElementById('glucose').value);
            const smoking = document.getElementById('smoking').value;
            const alcohol = document.getElementById('alcohol').value;
            const activity = document.getElementById('activity').value;
            const diet = document.getElementById('diet').value;
            const hypertension = document.getElementById('hypertension').value;
            const heartDisease = document.getElementById('heartDisease').value;
            const diabetes = document.getElementById('diabetes').value;
            const familyHistory = document.getElementById('familyHistory').value;

            let riskScore = 0;
            let maxRisk = 100;

            // Age risk (0-25 points)
            if (age >= 65) riskScore += 25;
            else if (age >= 55) riskScore += 18;
            else if (age >= 45) riskScore += 12;
            else if (age >= 35) riskScore += 6;
            else riskScore += 2;

            // Gender risk (5 points for males, 2 for females)
            if (gender === 'male') riskScore += 5;
            else if (gender === 'female') riskScore += 2;

            // Marital status (stress factor)
            if (marital === 'divorced' || marital === 'widowed') riskScore += 8;
            else if (marital === 'single') riskScore += 4;

            // Cholesterol risk (0-15 points)
            if (cholesterol >= 240) riskScore += 15;
            else if (cholesterol >= 200) riskScore += 10;
            else if (cholesterol >= 180) riskScore += 5;

            // Blood Pressure risk (0-20 points) - Single value
            let bpRisk = 0;
            if (bloodPressure >= 180) bpRisk = 20;
            else if (bloodPressure >= 140) bpRisk = 15;
            else if (bloodPressure >= 130) bpRisk = 10;
            else if (bloodPressure >= 120) bpRisk = 5;
            riskScore += bpRisk;

            // BMI risk (0-10 points)
            if (bmi >= 30) riskScore += 10;
            else if (bmi >= 25) riskScore += 6;
            else if (bmi >= 18.5) riskScore += 2;
            else riskScore += 4; // Underweight also risky

            // Glucose risk (0-15 points)
            if (glucose >= 200) riskScore += 15;
            else if (glucose >= 140) riskScore += 10;
            else if (glucose >= 110) riskScore += 5;

            // Smoking risk (0-12 points)
            if (smoking === 'current') riskScore += 12;
            else if (smoking === 'former') riskScore += 6;

            // Alcohol risk (0-10 points)
            if (alcohol === 'heavy') riskScore += 10;
            else if (alcohol === 'moderate') riskScore += 5;
            else if (alcohol === 'occasional') riskScore += 2;

            // Physical activity (0-10 points - inverse)
            if (activity === 'sedentary') riskScore += 10;
            else if (activity === 'light') riskScore += 7;
            else if (activity === 'moderate') riskScore += 3;
            else riskScore += 0;

            // Diet quality (0-8 points - inverse)
            if (diet === 'poor') riskScore += 8;
            else if (diet === 'average') riskScore += 5;
            else if (diet === 'good') riskScore += 2;
            else riskScore += 0;

            // Medical conditions (each adds points)
            if (hypertension === 'yes') riskScore += 12;
            if (heartDisease === 'yes') riskScore += 15;
            if (diabetes === 'yes') riskScore += 12;
            if (familyHistory === 'yes') riskScore += 10;

            // Calculate percentage (capped at 100)
            let riskPercentage = Math.min(100, Math.round((riskScore / maxRisk) * 100));
            
            let riskLevel = '';
            if (riskPercentage >= 60) {
                riskLevel = 'HIGH';
            } else if (riskPercentage >= 30) {
                riskLevel = 'MODERATE';
            } else {
                riskLevel = 'LOW';
            }
            
            return {
                percentage: riskPercentage,
                riskLevel: riskLevel
            };
        }

        function getRecommendations(riskLevel, riskPercentage) {
            if (riskLevel === 'HIGH') {
                return {
                    message: "⚠️ URGENT: You are at HIGH risk of stroke!",
                    recommendations: [
                        "🩺 Consult a doctor IMMEDIATELY for a complete health checkup",
                        "💊 Take prescribed medications regularly if you have existing conditions",
                        "🏃 Start with gentle exercises under medical supervision",
                        "🥗 Adopt a strict heart-healthy diet (low salt, low fat, high fiber)",
                        "🚭 Quit smoking and limit alcohol consumption completely",
                        "📊 Monitor your blood pressure and blood sugar daily",
                        "⚖️ Work on weight management with professional guidance"
                    ]
                };
            } else if (riskLevel === 'MODERATE') {
                return {
                    message: "⚠️ You have MODERATE risk of stroke. Take action now!",
                    recommendations: [
                        "🏥 Schedule a health checkup within the next month",
                        "🚶 Exercise at least 30 minutes, 5 days a week",
                        "🥦 Reduce salt, sugar, and processed food intake",
                        "🚭 Consider quitting smoking if you smoke",
                        "🍷 Limit alcohol to occasional consumption",
                        "💧 Stay hydrated and maintain healthy sleep schedule",
                        "📉 Monitor your blood pressure and cholesterol levels"
                    ]
                };
            } else {
                return {
                    message: "✅ Good news! You are at LOW risk of stroke.",
                    recommendations: [
                        "🎯 Maintain your healthy lifestyle habits",
                        "🏋️ Continue regular physical activity",
                        "🍎 Keep eating a balanced, nutritious diet",
                        "🩸 Get annual health checkups to monitor key indicators",
                        "😴 Ensure 7-8 hours of quality sleep",
                        "🧘 Practice stress management techniques",
                        "📚 Stay informed about stroke prevention"
                    ]
                };
            }
        }

        function predictStroke() {
            const result = calculateStrokeRisk();
            const recommendations = getRecommendations(result.riskLevel, result.percentage);
            
            const resultDiv = document.getElementById('result');
            resultDiv.classList.remove('hidden', 'high-risk', 'moderate-risk', 'low-risk');
            
            if (result.riskLevel === 'HIGH') {
                resultDiv.classList.add('high-risk');
            } else if (result.riskLevel === 'MODERATE') {
                resultDiv.classList.add('moderate-risk');
            } else {
                resultDiv.classList.add('low-risk');
            }
            
            resultDiv.innerHTML = `
                <h3>${recommendations.message}</h3>
                <div class="risk-percentage">
                    Stroke Risk: ${result.percentage}%
                </div>
                <p>Based on your clinical measurements and lifestyle factors</p>
                <div class="recommendations">
                    <strong>📋 Personalized Recommendations:</strong>
                    <ul>
                        ${recommendations.recommendations.map(rec => `<li>${rec}</li>`).join('')}
                    </ul>
                </div>
                <p style="margin-top: 20px; font-size: 0.9em;">
                    ⚠️ Note: This is a predictive tool based on risk factors. Always consult healthcare professionals for medical advice.
                </p>
            `;
            
            // Scroll to result
            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
